services:
  postgres:
    image: postgres:17-alpine
    container_name: proofmark-example-postgres
    environment:
      POSTGRES_DB: proofmark_example
      POSTGRES_USER: proofmark
      POSTGRES_PASSWORD: proofmark
    ports:
      - "55432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofmark -d proofmark_example"]
      interval: 2s
      timeout: 5s
      retries: 20
